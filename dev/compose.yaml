name: aipay-p2
x-service: &service
  user: '${AIPAY_DEV_UID}:${AIPAY_DEV_GID}'
  networks: [private]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 25s
x-probe: &probe
  interval: 3s
  timeout: 5s
  retries: 20
  start_period: 10s
x-owner-build: &owner-build
  dockerfile: ../servicekit/dev/Dockerfile.signing
  additional_contexts: {contract: ../../protobuf, module_auth: ../script}
  secrets: [aipay_modules_token]
x-gateway: &gateway
  image: kaivo-p2/upstream-gateway:dev
  build:
    context: ../../upstream-gateway
    dockerfile: ../servicekit/dev/Dockerfile.gateway
  user: '${AIPAY_DEV_UID}:${AIPAY_DEV_GID}'
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 80s
  restart: on-failure
  network_mode: service:upstream-sim
  depends_on:
    postgres: {condition: service_healthy}
    upstream-sim: {condition: service_healthy}
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run dev/prepare.py}
    env_file:
      - ${AIPAY_DEV_DIR}/env/provision.env
    volumes:
      - postgres:/var/lib/postgresql
      - ./init-databases.sh:/docker-entrypoint-initdb.d/10-aipay.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [private]
  redis:
    image: redis:8
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run dev/prepare.py}
    command: [sh, -c, 'exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [private]
  queue-redis:
    image: redis:8
    environment:
      REDIS_PASSWORD: ${QUEUE_REDIS_PASSWORD:?run dev/prepare.py for this stack}
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes: [queue-redis:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [private]
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    command: [--config, /etc/aipay/jaeger.yaml]
    environment:
      AIPAY_JAEGER_QUERY_ADDR: 0.0.0.0:16686
      AIPAY_JAEGER_QUERY_GRPC_ADDR: 0.0.0.0:16685
      AIPAY_JAEGER_OTLP_ADDR: 0.0.0.0:4317
    volumes: [./jaeger.yaml:/etc/aipay/jaeger.yaml:ro]
    ports: ['127.0.0.1:16686:16686']
    networks: [private]
  collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: [--config, /etc/aipay/collector.yaml]
    environment:
      AIPAY_COLLECTOR_ADDR: 0.0.0.0:4317
      AIPAY_JAEGER_OTLP_ADDR: jaeger:4317
    volumes: [./collector.yaml:/etc/aipay/collector.yaml:ro]
    ports: ['127.0.0.1:4317:4317']
    depends_on: [jaeger]
    networks: [private]
  iam-migrate:
    <<: *service
    image: kaivo-p2/iam:dev
    build:
      <<: *owner-build
      context: ../../iam
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/iam-migrate.env
        format: raw
    command: [migrate, up]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: {disable: true}
  ledger-migrate:
    <<: *service
    image: kaivo-p2/ledger:dev
    build:
      context: ../../ledger
      secrets: [aipay_modules_token]
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/ledger-migrate.env
        format: raw
    command: [migrate, up]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: {disable: true}
  payment-migrate:
    <<: *service
    image: kaivo-p2/payment:dev
    build:
      <<: *owner-build
      context: ../../payment
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/payment-migrate.env
        format: raw
    command: [migrate, up]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: {disable: true}
  reconciliation-migrate:
    <<: *service
    image: kaivo-p2/reconciliation:dev
    build:
      <<: *owner-build
      context: ../../reconciliation
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/reconciliation-migrate.env
        format: raw
    command: [migrate, up]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: {disable: true}
  settlement-migrate:
    <<: *service
    image: kaivo-p2/settlement:dev
    build:
      context: ../../settlement
      secrets: [aipay_modules_token]
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/settlement-migrate.env
        format: raw
    command: [migrate, up]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: {disable: true}
  backend-migrate:
    <<: *service
    image: kaivo-p2/backend:dev
    build:
      <<: *owner-build
      context: ../../backend
      target: backend
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/backend-migrate.env
        format: raw
    command: [migrate, up]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: {disable: true}
  upstream-sim:
    <<: *service
    image: kaivo-p2/upstream-sim:dev
    # Keep the simulator unmodified. The Alpine runtime supplies its HTTP probe.
    build:
      context: ../../upstream-sim
      dockerfile_inline: |
        FROM golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5 AS build
        WORKDIR /src
        COPY . .
        RUN GOWORK=off CGO_ENABLED=0 go build -mod=readonly -trimpath -o /out/upstream-sim ./cmd/upstream-sim
        FROM alpine:3.23
        COPY --from=build --chmod=0755 /out/upstream-sim /app/upstream-sim
        USER 65532:65532
        ENTRYPOINT ["/app/upstream-sim"]
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/upstream-sim.env
        format: raw
    volumes:
      - ${AIPAY_DEV_DIR}/logs/upstream-sim:/app/logs
      - ${AIPAY_DEV_DIR}/inputs/upstream-sim:/run/kaivo/inputs:ro
    ports:
      - '127.0.0.1:9080:9080'
      - '127.0.0.1:9104:9104'
      - '127.0.0.1:9105:9105'
      - '127.0.0.1:9107:9107'
      - '127.0.0.1:9108:9108'
    healthcheck:
      <<: *probe
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9080/healthz]
  upstream-gateway-trade:
    <<: *gateway
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/upstream-gateway-trade.env
        format: raw
    volumes:
      - ${AIPAY_DEV_DIR}/inputs/upstream-gateway-trade:/run/kaivo/inputs:ro
      - ${AIPAY_DEV_DIR}/certs/ca.crt:/run/kaivo/ca.crt:ro
      - ${AIPAY_DEV_DIR}/certs/upstream-gateway-trade:/run/kaivo/identity:ro
    healthcheck:
      <<: *probe
      test: [CMD, /bin/bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/9107']
  upstream-gateway-verification:
    <<: *gateway
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/upstream-gateway-verification.env
        format: raw
    volumes:
      - ${AIPAY_DEV_DIR}/inputs/upstream-gateway-verification:/run/kaivo/inputs:ro
      - ${AIPAY_DEV_DIR}/certs/ca.crt:/run/kaivo/ca.crt:ro
      - ${AIPAY_DEV_DIR}/certs/upstream-gateway-verification:/run/kaivo/identity:ro
    healthcheck:
      <<: *probe
      test: [CMD, /bin/bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/9108']
  cashier:
    <<: *service
    image: python:3.13-alpine
    command: [python3, -B, /app/cashier.py]
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/cashier.env
        format: raw
    volumes:
      - ./cashier.py:/app/cashier.py:ro
      - ${AIPAY_DEV_DIR}/certs/cashier:/run/kaivo/identity:ro
      - ${AIPAY_DEV_DIR}/certs/ca.crt:/run/kaivo/ca.crt:ro
    ports: ['127.0.0.1:9443:9443']
    depends_on:
      upstream-sim: {condition: service_healthy}
    healthcheck:
      <<: *probe
      test: [CMD, python3, -c, "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:9443/healthz', context=ssl.create_default_context(cafile='/run/kaivo/ca.crt'), timeout=3).close()"]
  iam:
    <<: *service
    image: kaivo-p2/iam:dev
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/iam.env
        format: raw
    volumes:
      - ${AIPAY_DEV_DIR}/logs/iam:/app/logs
      - ${AIPAY_DEV_DIR}/inputs/iam:/run/kaivo/inputs:ro
      - ${AIPAY_DEV_DIR}/data/iam:/run/kaivo/data
      - ${AIPAY_DEV_DIR}/certs/ca.crt:/run/kaivo/ca.crt:ro
      - ${AIPAY_DEV_DIR}/certs/iam:/run/kaivo/identity:ro
      - ${AIPAY_DEV_DIR}/certs/public:/run/kaivo/public:ro
    ports:
      - '127.0.0.1:9101:9101'
    healthcheck:
      <<: *probe
      test: [CMD, /app/service, healthcheck]
    depends_on:
      iam-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      queue-redis: {condition: service_healthy}
  ledger:
    <<: *service
    image: kaivo-p2/ledger:dev
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/ledger.env
        format: raw
    volumes:
      - ${AIPAY_DEV_DIR}/logs/ledger:/app/logs
      - ${AIPAY_DEV_DIR}/inputs/ledger:/run/kaivo/inputs:ro
      - ${AIPAY_DEV_DIR}/data/ledger:/run/kaivo/data
      - ${AIPAY_DEV_DIR}/certs/ca.crt:/run/kaivo/ca.crt:ro
      - ${AIPAY_DEV_DIR}/certs/ledger:/run/kaivo/identity:ro
      - ${AIPAY_DEV_DIR}/certs/public:/run/kaivo/public:ro
    ports:
      - '127.0.0.1:9102:9102'
    healthcheck:
      <<: *probe
      test: [CMD, /app/kaivo-ledger, healthcheck]
    depends_on:
      ledger-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  payment:
    image: kaivo-p2/payment:dev
    user: '${AIPAY_DEV_UID}:${AIPAY_DEV_GID}'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 25s
    network_mode: service:upstream-sim
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/payment.env
        format: raw
    volumes:
      - ${AIPAY_DEV_DIR}/logs/payment:/app/logs
      - ${AIPAY_DEV_DIR}/inputs/payment:/run/kaivo/inputs:ro
      - ${AIPAY_DEV_DIR}/data/payment:/run/kaivo/data
      - ${AIPAY_DEV_DIR}/certs/ca.crt:/run/kaivo/ca.crt:ro
      - ${AIPAY_DEV_DIR}/certs/payment:/run/kaivo/identity:ro
      - ${AIPAY_DEV_DIR}/certs/public:/run/kaivo/public:ro
    healthcheck:
      <<: *probe
      test: [CMD, /app/service, healthcheck]
    depends_on:
      payment-migrate: {condition: service_completed_successfully}
      upstream-gateway-trade: {condition: service_healthy}
      upstream-gateway-verification: {condition: service_healthy}
      redis: {condition: service_healthy}
      queue-redis: {condition: service_healthy}
      iam: {condition: service_healthy}
      ledger: {condition: service_healthy}
      upstream-sim: {condition: service_healthy}
  notifier:
    <<: *service
    image: kaivo-p2/payment:dev
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/notifier.env
        format: raw
    volumes:
      - ${AIPAY_DEV_DIR}/logs/notifier:/app/logs
      - ${AIPAY_DEV_DIR}/certs/ca.crt:/run/kaivo/ca.crt:ro
      - ${AIPAY_DEV_DIR}/certs/notifier:/run/kaivo/identity:ro
    ports:
      - '127.0.0.1:9115:9115'
    command: [notifier]
    healthcheck:
      <<: *probe
      test: [CMD, env, AIPAY_NOTIFIER_GRPC_ADDR=127.0.0.1:9115, /app/service, notifier, healthcheck]
    depends_on:
      payment: {condition: service_healthy}
  reconciliation:
    image: kaivo-p2/reconciliation:dev
    user: '${AIPAY_DEV_UID}:${AIPAY_DEV_GID}'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 25s
    network_mode: service:upstream-sim
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/reconciliation.env
        format: raw
    volumes:
      - ${AIPAY_DEV_DIR}/logs/reconciliation:/app/logs
      - ${AIPAY_DEV_DIR}/inputs/reconciliation:/run/kaivo/inputs:ro
      - ${AIPAY_DEV_DIR}/data/reconciliation:/run/kaivo/data
      - ${AIPAY_DEV_DIR}/certs/ca.crt:/run/kaivo/ca.crt:ro
      - ${AIPAY_DEV_DIR}/certs/reconciliation:/run/kaivo/identity:ro
      - ${AIPAY_DEV_DIR}/certs/public:/run/kaivo/public:ro
    healthcheck:
      <<: *probe
      test: [CMD, /app/service, healthcheck]
    depends_on:
      reconciliation-migrate: {condition: service_completed_successfully}
      upstream-gateway-trade: {condition: service_healthy}
      upstream-gateway-verification: {condition: service_healthy}
      redis: {condition: service_healthy}
      ledger: {condition: service_healthy}
      payment: {condition: service_healthy}
      upstream-sim: {condition: service_healthy}
  settlement:
    <<: *service
    image: kaivo-p2/settlement:dev
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/settlement.env
        format: raw
    volumes:
      - ${AIPAY_DEV_DIR}/logs/settlement:/app/logs
      - ${AIPAY_DEV_DIR}/inputs/settlement:/run/kaivo/inputs:ro
      - ${AIPAY_DEV_DIR}/data/settlement:/run/kaivo/data
      - ${AIPAY_DEV_DIR}/certs/ca.crt:/run/kaivo/ca.crt:ro
      - ${AIPAY_DEV_DIR}/certs/settlement:/run/kaivo/identity:ro
      - ${AIPAY_DEV_DIR}/certs/public:/run/kaivo/public:ro
    ports:
      - '127.0.0.1:9103:9103'
    healthcheck:
      <<: *probe
      test: [CMD, /app/kaivo-settlement, healthcheck]
    depends_on:
      settlement-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  backend:
    <<: *service
    image: kaivo-p2/backend:dev
    env_file:
      - path: ${AIPAY_DEV_DIR}/env/backend.env
        format: raw
    volumes:
      - ${AIPAY_DEV_DIR}/logs/backend:/app/logs
      - ${AIPAY_DEV_DIR}/inputs/backend:/run/kaivo/inputs:ro
      - ${AIPAY_DEV_DIR}/data/backend:/run/kaivo/data
      - ${AIPAY_DEV_DIR}/certs/ca.crt:/run/kaivo/ca.crt:ro
      - ${AIPAY_DEV_DIR}/certs/backend:/run/kaivo/identity:ro
      - ${AIPAY_DEV_DIR}/certs/public:/run/kaivo/public:ro
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:8081:8081'
      - '127.0.0.1:8082:8082'
    healthcheck:
      <<: *probe
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/ready]
    depends_on:
      backend-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      iam: {condition: service_healthy}
      payment: {condition: service_healthy}
networks:
  private:
    internal: true
volumes:
  postgres:
  queue-redis:
secrets:
  aipay_modules_token:
    environment: AIPAY_MODULES_TOKEN
