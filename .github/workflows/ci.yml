name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: servicekit
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: servicekit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servicekit -d servicekit_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - name: Unit and transport checks
        run: ./script/with-private-modules.sh make check
        env:
          AIPAY_MODULES_TOKEN: ${{ secrets.AIPAY_MODULES_TOKEN }}
      - name: Storage, tracing and queue integration
        run: ./script/with-private-modules.sh make test-integration
        env:
          AIPAY_MODULES_TOKEN: ${{ secrets.AIPAY_MODULES_TOKEN }}
          AIPAY_TEST_DATABASE_URL: postgres://servicekit:integration-only@127.0.0.1:5432/servicekit_test?sslmode=disable
          AIPAY_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          ./script/with-private-modules.sh govulncheck ./...
        env:
          AIPAY_MODULES_TOKEN: ${{ secrets.AIPAY_MODULES_TOKEN }}
